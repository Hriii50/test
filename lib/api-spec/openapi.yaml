openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MIZAN AI personal finance API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: finance
  - name: profile
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [finance]
      responses:
        "200":
          description: Current user's financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /transactions:
    get:
      operationId: listTransactions
      tags: [finance]
      responses:
        "200":
          description: Current user's transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createTransaction
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Saved transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteTransaction
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /budgets:
    get:
      operationId: listBudgets
      tags: [finance]
      responses:
        "200":
          description: Current user's budgets and current spend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
    post:
      operationId: createBudget
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "201":
          description: Saved budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
  /budgets/{id}:
    patch:
      operationId: updateBudget
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpdate"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteBudget
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /goals:
    get:
      operationId: listGoals
      tags: [finance]
      responses:
        "200":
          description: Current user's savings goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavingsGoal"
    post:
      operationId: createGoal
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Saved goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsGoal"
  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsGoal"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteGoal
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /advisor:
    get:
      operationId: getFinancialAdvice
      tags: [finance]
      responses:
        "200":
          description: Transparent rule-based analysis of the current user's real records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorResponse"
  /orders:
    get:
      operationId: listOrders
      tags: [finance]
      responses:
        "200":
          description: Current user's bills and recorded payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Saved bill or payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      responses:
        "200":
          description: Current user's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateProfile
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Request error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    User:
      type: object
      required: [id, name, email, currency]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        currency: { type: string, enum: [KWD] }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    ProfileUpdate:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
    Transaction:
      type: object
      required: [id, title, amount, type, category, date, note, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: number }
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        date: { type: string, format: date }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    TransactionInput:
      type: object
      required: [title, amount, type, category, date]
      properties:
        title: { type: string, minLength: 1 }
        amount: { type: number, exclusiveMinimum: 0 }
        type: { type: string, enum: [income, expense] }
        category: { type: string, minLength: 1 }
        date: { type: string, format: date }
        note: { type: string }
    TransactionUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        amount: { type: number, exclusiveMinimum: 0 }
        type: { type: string, enum: [income, expense] }
        category: { type: string, minLength: 1 }
        date: { type: string, format: date }
        note: { type: ["string", "null"] }
    Budget:
      type: object
      required: [id, category, limit, spent, month]
      properties:
        id: { type: string }
        category: { type: string }
        limit: { type: number }
        spent: { type: number }
        month: { type: string }
    BudgetInput:
      type: object
      required: [category, limit, month]
      properties:
        category: { type: string, minLength: 1 }
        limit: { type: number, exclusiveMinimum: 0 }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
    BudgetUpdate:
      type: object
      properties:
        category: { type: string, minLength: 1 }
        limit: { type: number, exclusiveMinimum: 0 }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
    SavingsGoal:
      type: object
      required: [id, title, targetAmount, currentAmount, targetDate, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        targetAmount: { type: number }
        currentAmount: { type: number }
        targetDate: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
    GoalInput:
      type: object
      required: [title, targetAmount, currentAmount]
      properties:
        title: { type: string, minLength: 1 }
        targetAmount: { type: number, exclusiveMinimum: 0 }
        currentAmount: { type: number, minimum: 0 }
        targetDate: { type: ["string", "null"], format: date }
    GoalUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        targetAmount: { type: number, exclusiveMinimum: 0 }
        currentAmount: { type: number, minimum: 0 }
        targetDate: { type: ["string", "null"], format: date }
    Order:
      type: object
      required: [id, title, amount, date, category, status, note]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: number }
        date: { type: string, format: date }
        category: { type: string }
        status: { type: string, enum: [paid, pending] }
        note: { type: ["string", "null"] }
    OrderInput:
      type: object
      required: [title, amount, date, category, status]
      properties:
        title: { type: string, minLength: 1 }
        amount: { type: number, exclusiveMinimum: 0 }
        date: { type: string, format: date }
        category: { type: string, minLength: 1 }
        status: { type: string, enum: [paid, pending] }
        note: { type: string }
    SpendingCategory:
      type: object
      required: [category, amount]
      properties:
        category: { type: string }
        amount: { type: number }
    MonthlySpending:
      type: object
      required: [month, amount]
      properties:
        month: { type: string }
        amount: { type: number }
    DashboardSummary:
      type: object
      required: [income, expenses, savings, spendingByCategory, monthlySpending, recentTransactions, budgetAlerts]
      properties:
        income: { type: number }
        expenses: { type: number }
        savings: { type: number }
        spendingByCategory:
          type: array
          items: { $ref: "#/components/schemas/SpendingCategory" }
        monthlySpending:
          type: array
          items: { $ref: "#/components/schemas/MonthlySpending" }
        recentTransactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        budgetAlerts:
          type: array
          items: { $ref: "#/components/schemas/BudgetAlert" }
    BudgetAlert:
      type: object
      required: [category, spent, limit, exceeded]
      properties:
        category: { type: string }
        spent: { type: number }
        limit: { type: number }
        exceeded: { type: boolean }
    AdvisorSuggestion:
      type: object
      required: [title, detail, kind]
      properties:
        title: { type: string }
        detail: { type: string }
        kind: { type: string, enum: [positive, warning, insight] }
    AdvisorResponse:
      type: object
      required: [suggestions, income, expenses, savingsRate]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/AdvisorSuggestion" }
        income: { type: number }
        expenses: { type: number }
        savingsRate: { type: number }

